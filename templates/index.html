<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>P2P File Sharing</title>
    <link rel="stylesheet" href="static/styles.css">
</head>
<body>
    <div class="container">
        <h2>P2P File Sharing</h2>
        <label>Room ID: <input type="text" id="roomID"></label>
        <button onclick="joinRoom()">Join Room</button>

        <br><br>

        <input type="file" id="fileInput">
        <button onclick="sendFile()">Send File</button>

        <h3>Received Files:</h3>
        <div id="receivedFiles"></div>
    </div>

    <script>
        let socket;
        function joinRoom() {
            let room = document.getElementById("roomID").value;
            if (room.trim() !== "") {
                socket = new WebSocket(`wss://${window.location.host}/ws/${room}`);

                socket.onmessage = function(event) {
                    let data = JSON.parse(event.data);
                    let downloadLink = document.createElement("a");
                    downloadLink.href = "data:application/octet-stream;base64," + data.filedata;
                    downloadLink.download = data.filename;
                    downloadLink.innerText = "Download " + data.filename;
                    document.getElementById("receivedFiles").appendChild(downloadLink);
                    document.getElementById("receivedFiles").appendChild(document.createElement("br"));
                };
            }
        }

        function sendFile() {
            let fileInput = document.getElementById("fileInput");
            let file = fileInput.files[0];
            if (!file) return alert("Select a file first.");

            let reader = new FileReader();
            reader.readAsDataURL(file);
            reader.onload = function () {
                let fileData = reader.result.split(",")[1];

                socket.send(JSON.stringify({
                    type: "file",
                    filename: file.name,
                    filedata: fileData
                }));
            };
        }
    </script>
</body>
</html>
