<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>P2P File Sharing</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='styles.css') }}">
</head>
<body>
    <h2>P2P File Sharing</h2>
    <label>Room ID: <input type="text" id="roomID"></label>
    <button onclick="joinRoom()">Join Room</button>
    
    <br><br>
    
    <input type="file" id="fileInput">
    <button onclick="sendFile()">Send File</button>

    <h3>Received Files:</h3>
    <div id="receivedFiles"></div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/socket.io/4.1.3/socket.io.js"></script>
    <script>
        var socket = io();
        var room = "";

        function joinRoom() {
            room = document.getElementById("roomID").value;
            if (room.trim() !== "") {
                socket.emit("join", { room: room });
            }
        }

        socket.on("message", function(data) {
            console.log(data.msg);
        });

        function sendFile() {
            let fileInput = document.getElementById("fileInput");
            let file = fileInput.files[0];

            if (!file || room === "") return alert("Select a file and join a room first.");

            let reader = new FileReader();
            reader.readAsDataURL(file);
            reader.onload = function () {
                let fileData = reader.result.split(",")[1];

                socket.emit("send_file", {
                    room: room,
                    filename: file.name,
                    filedata: fileData
                });
            };
        }

        socket.on("receive_file", function(data) {
            let downloadLink = document.createElement("a");
            downloadLink.href = "data:application/octet-stream;base64," + data.filedata;
            downloadLink.download = data.filename;
            downloadLink.innerText = "Download " + data.filename;
            document.getElementById("receivedFiles").appendChild(downloadLink);
            document.getElementById("receivedFiles").appendChild(document.createElement("br"));
        });
    </script>
</body>
</html>
